name: Deploy to Firebase Hosting
on:
  push: { branches: [main] }
  workflow_dispatch:
concurrency: { group: deploy, cancel-in-progress: true }
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'padel-survivor' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Deploy
        if: ${{ env.FIREBASE_TOKEN != '' }}
        run: npx --yes firebase-tools@13 deploy --only hosting --project "$PROJECT_ID" --non-interactive
