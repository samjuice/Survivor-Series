name: Test, migrate, deploy
on:
  push: { branches: [main] }
  workflow_dispatch:
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'padel-survivor' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Database tests (throwaway local Postgres)
        env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: postgres }
        run: ./scripts/test-db.sh
      - name: Apply database migrations to Supabase
        if: ${{ env.SUPABASE_DB_URL != '' }}
        env:
          DB_URL: ${{ env.SUPABASE_DB_URL }}
          EXPECTED_PROJECT_REF: ypwjoomizjxadrwifzrt
        run: ./scripts/migrate.sh
      - name: Verify live database
        if: ${{ env.SUPABASE_DB_URL != '' }}
        run: |
          set -euo pipefail
          q() { psql "$SUPABASE_DB_URL" -Atq -v ON_ERROR_STOP=1 -c "$1"; }
          tables=$(q "select count(*) from pg_tables where schemaname='public'")
          norls=$(q "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind='r' and not c.relrowsecurity")
          anon=$(q "select coalesce(string_agg(table_name||':'||privilege_type, ','), 'none') from information_schema.role_table_grants where grantee='anon' and table_schema='public'")
          extras=$(q "select count(*) from information_schema.role_table_grants where grantee in ('anon','authenticated') and table_schema='public' and privilege_type in ('TRUNCATE','REFERENCES','TRIGGER')")
          anonfn=$(q "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and has_function_privilege('anon', p.oid, 'execute')")
          fns="submit_result review_result record_walkover withdraw_team generate_fixtures replace_team_player prize_pool_cents my_roles has_registration list_users set_user_status delete_user list_competition_admins add_competition_admin remove_competition_admin link_placeholder assign_tribes randomize_captains set_lineup lock_lineups regenerate_fixtures create_americano score_americano_match set_americano_status delete_americano cast_vote award_tally set_award_winner publish_awards"
          want=$(echo $fns | wc -w)
          list=$(echo $fns | sed "s/ /','/g")
          rpcs=$(q "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname in ('$list')")
          authcols=$(q "select count(*) from information_schema.columns where (table_schema='auth' and table_name='users' and column_name in ('email','banned_until','encrypted_password','raw_user_meta_data','email_confirmed_at')) or (table_schema='auth' and table_name='identities' and column_name='user_id')")
          applied=$(q "select string_agg(name, ',' order by name) from ci.applied_migrations")
          msg="public tables: $tables | without RLS: $norls | anon grants: $anon | extra table privs: $extras | anon functions: $anonfn | RPCs: $rpcs/$want | auth columns: $authcols/6 | applied: $applied"
          echo "$msg"
          echo "::notice title=Live database check::$msg"
          [ "$norls" = "0" ] || { echo "::error title=Live database check::a public table has RLS off"; exit 1; }
          [ "$rpcs" = "$want" ] || { echo "::error title=Live database check::expected $want functions, found $rpcs"; exit 1; }
          [ "$authcols" = "6" ] || { echo "::error title=Live database check::auth columns needed by user management are missing ($authcols/6)"; exit 1; }
          [ "$extras" = "0" ] || { echo "::error title=Live database check::API roles hold TRUNCATE/REFERENCES/TRIGGER ($extras)"; exit 1; }
          [ "$anonfn" = "0" ] || { echo "::error title=Live database check::anon can execute $anonfn functions"; exit 1; }
          [ "$anon" = "competitions:SELECT" ] || { echo "::error title=Live database check::unexpected anon grants: $anon"; exit 1; }
      - name: Live API check (anonymous visitor must be refused)
        if: ${{ env.SUPABASE_DB_URL != '' }}
        run: ./scripts/live-smoke.sh
      - run: npm run build
      - name: Deploy
        if: ${{ env.FIREBASE_TOKEN != '' }}
        run: npx --yes firebase-tools@13 deploy --only hosting --project "$PROJECT_ID" --non-interactive
