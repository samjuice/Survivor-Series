<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1410" />
    <link rel="icon" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>The Padel Series: Survivor</title>
  </head>
  <body><div id="root"><div id="splash" style="min-height:100vh;display:grid;place-items:center;text-align:center;color:#e8dcc0;font-family:system-ui,sans-serif;padding:24px"><div><div style="color:#c9a227;letter-spacing:.3em;font-size:12px;text-transform:uppercase">The Padel Series</div><div style="font-size:40px;font-weight:700;margin:8px 0">Survivor</div><div id="splash-msg" style="opacity:.6;font-size:14px">Loading…</div></div></div></div>
    <script>
      (function () {
        function show(msg) {
          var el = document.getElementById("splash-msg");
          if (el) { el.style.color = "#e8a0a0"; el.style.opacity = "1"; el.textContent = "Startup problem: " + msg; }
        }
        window.addEventListener("error", function (e) {
          var t = e.target;
          show(t && t.src ? "could not load " + t.src.split("/").pop() : (e.message || "unknown error"));
        }, true);
        window.addEventListener("unhandledrejection", function (e) { show(String(e.reason && e.reason.message || e.reason)); });
      })();
    </script><script type="module" src="/src/main.tsx"></script></body>
</html>
